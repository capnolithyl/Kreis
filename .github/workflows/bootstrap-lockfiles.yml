name: Bootstrap dependency lockfiles
on:
  push:
    branches: [chore/reproducible-installer]
permissions:
  contents: write
jobs:
  lockfiles:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Generate lockfiles
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add package-lock.json src-tauri/Cargo.lock
          if (git diff --cached --quiet) { exit 0 }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: commit resolved npm and Cargo dependency graphs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/chore/reproducible-installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
