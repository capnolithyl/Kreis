name: Windows build check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify locked Rust dependencies
        shell: pwsh
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check extension scripts
        run: npm run check:extension
      - name: Test browser title filters
        run: npm run check:title-filter
      - name: Test Add to Kreis context menu data
        run: npm run check:context
      - name: Test ChatGPT conversation tab matching
        run: npm run check:chatgpt-tabs
      - name: Test radial drag and drop
        run: npm run check:wheel-drag
      - name: Test numbered Quick Keys and safe ten-slice migration
        run: npm run check:quick-keys
      - name: Test fresh-install starter shortcuts and settings preservation
        run: npm run check:starter
      - name: Test multi-browser profile migration, rename and deletion
        run: npm run check:browser-profiles
      - name: Test hub drag and monitor positioning
        run: npm run check:hub-drag
      - name: Test wheel item context actions
        run: npm run check:wheel-context
      - name: Test wheel color conversion
        run: npm run check:wheel-color
      - name: Test nested group hierarchy
        run: npm run check:groups
      - name: Test live browser tab profile/domain grouping
        run: npm run check:live-tabs
      - name: Test settings JSON import and export
        run: npm run check:settings-io
      - name: Validate Explorer tab lookup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/src-tauri/src/explorer_existing_tab.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Validate full Windows installer build
        run: npm run tauri build
      - name: Test installer SHA-256 manifest
        shell: pwsh
        run: ./scripts/installer-checksum.ps1
      - name: Ensure locked dependencies were unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
