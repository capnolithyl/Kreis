name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify locked Rust dependencies
        shell: pwsh
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check extension scripts
        run: npm run check:extension
      - name: Test browser title filters
        run: npm run check:title-filter
      - name: Test Add to Kreis context menu data
        run: npm run check:context
      - name: Test ChatGPT conversation tab matching
        run: npm run check:chatgpt-tabs
      - name: Test radial drag and drop
        run: npm run check:wheel-drag
      - name: Test nested group hierarchy
        run: npm run check:groups
      - name: Validate Explorer tab lookup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/src-tauri/src/explorer_existing_tab.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Generate and verify installer SHA-256
        shell: pwsh
        run: ./scripts/installer-checksum.ps1
      - name: Ensure locked dependencies were unchanged
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
      - name: Download installer from this run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Kreis-Windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
