name: Build Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check extension scripts
        run: npm run check:extension
      - name: Test browser title filters
        run: npm run check:title-filter
      - name: Validate Explorer tab lookup script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/src-tauri/src/explorer_existing_tab.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Build NSIS installer
        run: npm run tauri build
      - name: Download installer from this run
        uses: actions/upload-artifact@v4
        with:
          name: Kreis-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1
          if-no-files-found: error
