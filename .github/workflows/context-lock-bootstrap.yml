name: Update Cargo lockfile for context menus
on:
  push:
    branches: [feat/add-to-kreis-context-menus]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.99.1'
      - name: Resolve Rust dependencies
        shell: pwsh
        run: |
          cargo update --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add src-tauri/Cargo.lock
          if (git diff --cached --quiet) { exit 0 }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: lock Tauri single-instance dependency"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/add-to-kreis-context-menus
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
